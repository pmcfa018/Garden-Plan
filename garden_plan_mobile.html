<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Garden Plan — Belfast</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0e8d8;min-height:100vh}

.header{background:#2d5a1a;color:#f0ead8;padding:14px 16px 12px}
.header h1{font-size:17px;font-weight:600;margin-bottom:1px}
.header p{font-size:11px;opacity:.7;font-style:italic}

/* === TWO-COLUMN ON WIDE SCREENS === */
.layout{display:flex;flex-direction:column}
@media(min-width:680px){
  .layout{flex-direction:row;min-height:calc(100vh - 54px)}
  .left-col{width:340px;flex-shrink:0;border-right:1px solid #d0c8b4;display:flex;flex-direction:column}
  .right-col{flex:1;overflow-y:auto}
}

/* === LEFT COL === */
.left-col{background:#f8f3e8}
.map-wrap{padding:12px 12px 6px;display:flex;justify-content:center}
.garden-svg{width:100%;max-width:380px;display:block}
@media(min-width:680px){.garden-svg{max-width:none}}
.map-zone{cursor:pointer}
.map-zone:hover{opacity:.82}

/* Zone selector — horizontal scroll on mobile, vertical list on desktop */
.zone-label{font-size:10px;color:#8a7050;font-style:italic;padding:4px 12px 0;text-align:center}
@media(min-width:680px){.zone-label{text-align:left}}
.zone-strip{display:flex;overflow-x:auto;gap:5px;padding:8px 10px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.zone-strip::-webkit-scrollbar{display:none}
@media(min-width:680px){
  .zone-strip{flex-direction:column;overflow-x:visible;overflow-y:auto;flex:1;padding:6px 10px 10px;gap:2px}
}
.zpill{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;border:1px solid #c8b890;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;color:#3a2a10;transition:all .12s}
@media(min-width:680px){.zpill{border-radius:6px;white-space:normal;flex-shrink:1}}
.zpill:hover{background:#ede4d0}
.zpill.on{background:#2d5a1a;color:#f0ead8;border-color:#1a3a08}
.zpill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* === RIGHT COL / INFO === */
.right-col{background:#fdf9f2}
.info-wrap{padding:18px 16px}
@media(min-width:680px){.info-wrap{padding:24px 24px}}

.empty-state{padding:48px 16px;text-align:center;color:#9a8060}
.empty-state .icon{font-size:36px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px;font-style:italic;max-width:240px;margin:0 auto;line-height:1.6}

.zone-header{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #ddd4bc}
.zname{font-size:18px;font-weight:600;font-family:Georgia,serif;color:#1a1208;margin-bottom:4px}
.zaspect{font-size:11.5px;color:#8a6030;font-style:italic;margin-bottom:10px}
.zintro{font-size:13px;line-height:1.7;color:#3a2a10}

.plants-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7a6040;margin-bottom:10px;font-weight:600}
.plant-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:480px){.plant-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}

.pcard{background:#f8f3e8;border:1px solid #ddd4bc;border-radius:8px;overflow:hidden;border-left:3px solid #5a8c38}
.pimg-wrap{height:150px;background:#e4dcd0;overflow:hidden;position:relative}
.pimg-wrap.shimmer{background:linear-gradient(90deg,#e4dcd0 25%,#ede5d8 50%,#e4dcd0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pimg-wrap.ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d8e8c4,#e8f0d4)}
.ph-icon{font-size:44px;opacity:.5}
.pimg{width:100%;height:150px;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.pimg.loaded{opacity:1}
.pcard-body{padding:12px 13px 11px 13px}
.pname{font-size:14px;font-weight:600;font-family:Georgia,serif;color:#1a1208;margin-bottom:2px}
.platin{font-size:11px;font-style:italic;color:#8a6840;margin-bottom:8px}
.pbadge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin:0 4px 6px 0}
.ptype{background:#d8eec8;color:#1a4008;border:1px solid #b0d090}
.pseas{background:#f4e4c0;color:#6a3808;border:1px solid #dcc090}
.pnote{font-size:12.5px;line-height:1.65;color:#3a2a10}
</style>
</head>

<script>
var zones=[
{id:'railing',name:'Iron railing & wall bed',color:'#F5C0AC'},
{id:'cherry',name:'Cherry blossom corner',color:'#F4AECA'},
{id:'westbed',name:'West boundary bed',color:'#B8E090'},
{id:'efence',name:'East fence beds (front)',color:'#BED898'},
{id:'baywindow',name:'Bay window — raised porch',color:'#D4B896'},
{id:'porch',name:'Porch — baskets & pots',color:'#9EDBC8'},
{id:'eastside',name:'East side paved area',color:'#D4D0C4'},
{id:'patio',name:'Back patio',color:'#C0BAAE'},
{id:'lawn',name:'Back garden — pots',color:'#C8E8A4'}
];
var D={
railing:{a:'North boundary · west two-thirds · brick wall + iron railing · tapered bed · Belfast, north-facing',i:'The railing bed runs the west two-thirds of the north boundary. The bed depth tapers: about 110cm deep at the western end, narrowing gradually to nothing as it meets the driveway pillar at the east. This gives you much more planting room in the west — use that fuller depth for taller, bolder planting (climbers threading through the railing, larger shrubs) and reserve compact, low ground cover for the narrow eastern end. The 2-storey house to the south casts an extremely long shadow northward at Belfast\'s latitude (54.6°N) — almost no direct sun year-round. The year-round foliage backbone here comes from the pyracantha (fully evergreen) and winter jasmine (semi-evergreen), with sarcococca as an evergreen ground layer in the deeper west end. The climbing hydrangea is deciduous but contributes beautifully textured peeling bark through winter.',p:[
{n:'Climbing Hydrangea',l:'Hydrangea petiolaris',t:'Climber',s:'Jun–Aug',o:'Emma\'s favourite, and a perfect fit here. Thrives in deep shade and self-clings through iron railings. White lacecap flowers in summer; peeling amber bark through winter. Use the deeper west end where it has room to establish. Slow to start, then spectacular.'},
{n:'Winter Jasmine',l:'Jasminum nudiflorum',t:'Climber',s:'Nov–Feb',o:'Cheerful yellow flowers through the darkest months. Flexible stems weave naturally through iron railings. Belfast\'s mild winters mean the flowers rarely get frost-damaged. A good choice towards the east end where the bed is narrower — roots don\'t need much depth.'},
{n:'Pyracantha',l:'Pyracantha "Saphyr Orange"',t:'Wall shrub',s:'Spring & autumn',o:'White flowers in May, masses of fiery orange berries from September. Thorns add security to the railing; berries persist through winter for birds. Site in the deeper west end.'},
{n:'Ivy',l:'Hedera helix "Glacier"',t:'Evergreen climber',s:'Year-round',o:'The answer to clothing the iron railings in foliage every month of the year. "Glacier" has elegant silver-grey and white variegated leaves that show up beautifully in shade — much more striking than plain green ivy against iron railings. Self-clinging and will weave through the railing structure without any tying in. Works well alongside the climbing hydrangea: ivy covers the railings through winter when the hydrangea is bare.'},
{n:'Winter Box',l:'Sarcococca hookeriana var. humilis',t:'Evergreen shrub',s:'Dec–Feb (flowers) · year-round foliage',o:'A compact evergreen shrub — one of the finest plants for deep shade and one of the most fragrant things you can grow. Tiny white flowers from December to February fill the garden with a sweet vanilla scent in the darkest months. The glossy leaves hold through all seasons, providing a permanent ground-level structure in the deeper western end of the bed. Spreads slowly and steadily, needing almost no maintenance.'}
]},
cherry:{a:'NW corner · against the inner face of the railing wall · deep shade · part of west boundary bed · Belfast',i:'The cherry blossom tree sits in the NW corner, where the west boundary bed opens out to over a metre in depth — giving it plenty of room. It sits in the deep shade cast by the 2-storey house to the south, which the cherry tolerates well. The bed here is the widest part of the west boundary, so there\'s room for underplanting with species that genuinely thrive in deep, moist shade.',p:[
{n:'Heuchera',l:'Heuchera "Midnight Rose"',t:'Perennial',s:'Year-round foliage · May–Jul flowers',o:'Deep burgundy leaves splashed with rose-pink — striking year-round foliage colour that doesn\'t disappear in summer or winter. This fills the gap that bluebells leave when they die back completely after May. Produces small pink flower spikes in early summer and stays compact enough to share the corner comfortably with the cherry. Thrives in cool, moist shade; Belfast\'s climate is ideal.'},
{n:'Daffodils',l:'Narcissus "Jetfire"',t:'Bulb',s:'Mar–Apr',o:'A small reflexed variety flowering just before the cherry blossom — two successive spring events in the same corner. Compact enough for the widened bed area.'},
{n:'Bugle',l:'Ajuga reptans "Catlin\'s Giant"',t:'Ground cover',s:'Apr–Jun',o:'Bronze-leaved ground cover with blue-purple flower spikes. Loves Belfast\'s cool, moist conditions and suppresses weeds around the young tree base. Spreads steadily to link with the rest of the west boundary bed.'},
{n:'Daphne',l:'Daphne odora "Aureomarginata"',t:'Shrub',s:'Jan–Apr',o:'Intensely fragrant pink flowers just before cherry blossom. Belfast\'s mild winters suit it well — but ensure good drainage as it dislikes waterlogged soil. Suited to the wider NW corner.'},
{n:'Hellebore',l:'Helleborus x hybridus (deep pink)',t:'Perennial',s:'Jan–Apr',o:'Belfast\'s cool, moist climate is ideal for hellebores. A deep pink variety echoes the cherry and flowers from January — a beautiful preview weeks before the tree blooms.'}
]},
westbed:{a:'Along west hedge · 30cm deep (opens to 110cm+ in NW corner) · full length of hedge · deep shade · Belfast',i:'A narrow 30cm-deep bed running the full length of the west hedge. Because this bed sits directly in front of a substantial hedge, the hedge itself provides the year-round green backdrop — the planting doesn\'t need to carry the same evergreen burden as the east fence bed, which sits in front of bare fence panels. That frees this bed up to focus more on seasonal fragrance and flower colour. The NW corner — where the cherry blossom is — opens to over a metre and is covered under that zone. Along the narrow 30cm strip, compact spreading plants work best, with the hedge doing the structural heavy lifting behind them.',p:[
{n:'Ajuga',l:'Ajuga reptans "Atropurpurea"',t:'Ground cover',s:'Apr–Jun',o:'Bronze-purple rosettes carpet the ground and send up blue flower spikes in spring. One of the best plants for exactly this kind of narrow, dry-shaded hedge bed. Spreads steadily in Belfast\'s cool, moist climate to fill the 30cm strip without overstepping it.'},
{n:'Vinca',l:'Vinca minor "Atropurpurea"',t:'Ground cover',s:'Apr–Jun (sporadic to Sep)',o:'Deep purple flowers above small evergreen leaves. Highly tolerant of dry shade under hedge roots — one of the few plants that genuinely thrives in that difficult niche. Suppresses weeds year-round and needs almost no maintenance.'},
{n:'Lily of the Valley',l:'Convallaria majalis',t:'Perennial',s:'Apr–May',o:'One of the finest fragrant plants for deep shade. Spreads via rhizomes to fill a narrow bed beautifully. Belfast\'s cool, moist climate is perfect for it — it grows well without any extra watering and produces excellent fragrance in cool conditions.'},
{n:'Epimedium',l:'Epimedium x versicolor "Sulphureum"',t:'Ground cover',s:'Mar–May (leaves year-round)',o:'Tough and drought-tolerant under hedge roots where competition for moisture is fierce. Heart-shaped leaves with small yellow spring flowers. Semi-evergreen, providing winter interest in the narrow strip. One of the best plants for difficult dry shade.'},
{n:'Cyclamen',l:'Cyclamen hederifolium',t:'Corm',s:'Sep–Nov',o:'Autumn flowers — pink and white — arriving when almost nothing else blooms in deep shade. Excellent under the hedge roots where it tolerates dry conditions. The beautifully marbled ivy-shaped leaves persist through winter and into spring, giving ground cover long after the flowers finish.'}
]},
efence:{a:'East boundary fence (4ft) · 30cm deep along most of its length · 110cm pocket in SE corner · very deep shade · Belfast',i:'The east fence bed runs from the brick pillar at the north down to the E-W gate fence. Along most of its length the bed is only 30cm deep — a narrow strip that limits planting to compact plants. The exception is the south-east corner where it meets the side fence: here the depth opens out to about 110cm, giving a proper pocket for the camellia. The beds are in very deep shade from the 2-storey house, with the 4ft east fence adding to this by blocking low morning sun. The year-round foliage backbone here is strong: camellia (fully evergreen), hart\'s tongue fern (evergreen), hellebore (semi-evergreen, holding leaves through winter), heuchera (evergreen foliage all year), and soft shield fern (evergreen). This bed should look furnished in every month.',p:[
{n:'Camellia',l:'Camellia japonica "Adolphe Audusson"',t:'Wall shrub',s:'Feb–Apr',o:'Best planted in the SE corner pocket where there\'s 110cm of depth and shelter from both fences — room to establish and a protected spot for the early blooms. Belfast is one of the best places in the UK to grow camellias. The shade here suits them perfectly, Belfast\'s mild winters protect the buds, and Ireland\'s acid soils are ideal.'},
{n:'Hellebore',l:'Helleborus x hybridus (mixed)',t:'Perennial',s:'Jan–Apr',o:'Compact and perfectly suited to the narrow 30cm sections — clumps stay tight and add colour from January in conditions most plants would refuse. Belfast\'s cool, moist climate is textbook for hellebores.'},
{n:'Heuchera',l:'Heuchera "Plum Pudding"',t:'Perennial',s:'Year-round foliage · Jun flowers',o:'Rich purple-plum leaves with a silver-metallic sheen — striking year-round foliage in front of the fence panels where bare patches in winter would be most obvious. Stays compact and tidy within the 30cm bed, producing small white flower spikes in early summer. Much better value than astilbe for this bed because it never disappears.'},
{n:'Soft Shield Fern',l:'Polystichum setiferum',t:'Fern',s:'Year-round',o:'An elegantly feathery evergreen fern — different in character from the hart\'s tongue fern, with finely divided arching fronds that add a delicate texture to the narrow bed. Stays compact enough for the 30cm sections. Combined with the hart\'s tongue fern this gives two very different fern textures side by side, both evergreen, covering the ground in front of the fence throughout the year. Thrives in Belfast\'s mild, moist climate.'},
{n:'Hart\'s Tongue Fern',l:'Asplenium scolopendrium',t:'Fern',s:'Year-round',o:'A compact evergreen fern that stays tidily within a 30cm bed — much better suited to the narrow sections than a male fern. Glossy strap-like fronds provide year-round structure in deep shade. Thrives in Belfast\'s mild, wet maritime climate and looks superb beside hellebores.'}
]},
baywindow:{a:'North-facing · raised porch step · seasonal bulb lasagne pots · sheltered · Belfast',i:'The raised porch step is ideal for a seasonal pot display built around bulb lasagnes — layering different bulbs at different depths in the same pot so they come up in sequence, giving you a rolling spring display from a single container. In autumn, plant the largest bulbs deepest, then layer smaller ones above, finishing with the shallowest at the top. In a north-facing Belfast porch the sequence runs from January through to May or June; when the bulbs finish, lift the pot out, let the foliage die back, store the bulbs somewhere cool and dry, and bring in summer shade bedding to take over. The cards below show the layering sequence — plant them all in the same pot in autumn.',p:[
{n:'Bottom layer — Tulips',l:'Tulipa "Queen of Night" or "Apricot Beauty"',t:'Bulb · plant 15–18cm deep',s:'Apr–May',o:'The last to flower and the deepest in the pot. Dark "Queen of Night" or soft "Apricot Beauty" both perform better than most tulips in lower light. Plant nose-up, 15–18cm down from the surface. These anchor the pot display and give the grand finale.'},
{n:'Middle layer — Miniature Daffodils',l:'Narcissus "Tête-à-Tête" or "Jetfire"',t:'Bulb · plant 10–12cm deep',s:'Mar–Apr',o:'Small daffodils are among the most reliable bulbs for lower-light positions. "Tête-à-Tête" (yellow) or "Jetfire" (yellow with swept-back petals) both tolerate a north-facing porch well. Plant above the tulip layer, 10–12cm from the surface. They flower 3–4 weeks before the tulips.'},
{n:'Upper layer — Grape Hyacinth',l:'Muscari armeniacum',t:'Bulb · plant 5–7cm deep',s:'Mar–Apr',o:'Cobalt-blue spikes that flower alongside the daffodils and last for weeks. Very compact and shallow-rooting — perfect for the top layer of the lasagne. The blue of the muscari against yellow daffodils is a classic combination. Plant just 5–7cm below the surface.'},
{n:'Top layer — Snowdrops',l:'Galanthus nivalis (plant in the green)',t:'Bulb · plant just below surface',s:'Jan–Mar',o:'The very first to emerge, sometimes in January. Buy and plant snowdrops "in the green" (with foliage attached) in early spring for reliable establishment — dry bulbs in autumn rarely succeed. Tuck them in just below the surface above everything else. They mark the start of the sequence while the layers beneath are still sleeping.'},
{n:'Summer swap-in',l:'Begonia x tuberhybrida (upright) or Impatiens "Beacon"',t:'Annual bedding',s:'Jun–Oct',o:'When the lasagne finishes in May or June, lift the pot and store the bulbs somewhere cool and dry for replanting in autumn. Swap in summer shade bedding — upright begonias or mildew-resistant busy lizzies are the best choices for a north-facing sheltered porch in Belfast. They give colour all the way through to the first frosts.'}
]},
porch:{a:'NE corner of house · north-facing · sheltered · baskets + pots · Belfast',i:'The porch is at the NE corner, a third of the house width, with the brick pillar just visible to the north. North-facing and sheltered — exactly the conditions where Belfast\'s maritime climate gives a real advantage. The cool, moist summers mean shade-tolerant plants perform better here than in most of the UK.',p:[
{n:'Camellia in pot',l:'Camellia x williamsii "Jury\'s Yellow"',t:'Shrub in pot',s:'Feb–Apr',o:'An unusual cream-yellow camellia that flowers in late winter when the porch is at its most bare. Belfast\'s mild winters are outstanding for camellias in containers — the blooms rarely get frost-damaged. Grow in ericaceous compost and keep in the sheltered porch corner.'},
{n:'Trailing Begonia',l:'Begonia x tuberhybrida pendula',t:'Tender perennial',s:'Jun–Oct',o:'Genuinely prefer a shaded position — a north-facing Belfast porch is ideal for hanging baskets. The cool, moist summers suit them and prevent the flower scorching seen in hotter climates. Tuberous — store indoors over winter.'},
{n:'Hydrangea in pot',l:'Hydrangea macrophylla "Annabelle"',t:'Shrub in pot',s:'Jun–Sep',o:'Hydrangeas flourish in Belfast\'s cool, moist climate like almost nowhere else. A large-headed white mophead in a generous pot handles the north light and looks spectacular through summer.'},
{n:'Trailing Ivy',l:'Hedera helix "Golden Child"',t:'Evergreen',s:'Year-round',o:'Gold-variegated year-round structural spiller for the hanging baskets. Provides continuity between seasonal changes and looks good in winter when tender plants come inside.'},
{n:'Busy Lizzie',l:'Impatiens walleriana (mildew-resistant)',t:'Annual',s:'Jun–Oct',o:'Continuous colour in deep shade all summer. Choose a mildew-resistant variety — Belfast\'s high humidity can cause problems with older strains. Modern series like "Beacon" have much better resistance.'}
]},
eastside:{a:'East of house · 6–7ft east fence · morning to midday sun · sheltered · Belfast',i:'The 6–7ft east fence blocks very low-angle early morning sun. Between mid-morning and early afternoon this area gets a useful window of light; the 2-storey house to the west casts shade from mid-afternoon. The house wall provides warmth and shelter from Belfast\'s prevailing SW winds.',p:[
{n:'Climbing Rose',l:'Rosa "Generous Gardener"',t:'Climber',s:'Jun–Oct',o:'Wonderfully fragrant and repeat-flowering. Belfast\'s rainfall can encourage blackspot, so "Generous Gardener" is a good choice for its disease resistance. Good air circulation along the fence helps.'},
{n:'Clematis',l:'Clematis "The President"',t:'Climber',s:'May–Sep',o:'Deep purple-blue flowers from May through September. Pairs beautifully with the climbing rose. Clematis do very well in Belfast\'s cool, moist conditions.'},
{n:'Japanese Maple',l:'Acer palmatum "Bloodgood"',t:'Tree in pot',s:'Spring–Autumn',o:'Deep burgundy to brilliant scarlet in autumn. The sheltered east side is ideal — Belfast wind can shred Japanese maple leaves, but this spot is protected from SW winds by the house.'},
{n:'Hydrangea',l:'Hydrangea aspera "Villosa Group"',t:'Shrub',s:'Jul–Sep',o:'A large-leaved species hydrangea that handles partial shade exceptionally well. Lacecap flowers in soft lilac and white. Belfast\'s moist, mild climate is perfect for hydrangeas of all kinds.'},
{n:'Rosemary',l:'Salvia rosmarinus "Miss Jessopp\'s Upright"',t:'Herb/shrub',s:'Year-round',o:'Can work in this sheltered spot but needs very good drainage — Belfast\'s high rainfall can cause root rot in heavy soil. Raise the bed or incorporate plenty of grit.'}
]},
patio:{a:'South-facing · bifold door area · best light after lawn · Belfast',i:'The back patio is south-facing — the best-lit zone outside the open lawn. In Belfast\'s cloudy maritime climate you\'ll get less sun than a southern UK garden, but south-facing still makes a significant difference. The north edge near the house gets some shadow; the SE house extension creates a sheltered corner on its east side.',p:[
{n:'Bay Tree (standard)',l:'Laurus nobilis',t:'Evergreen in pot',s:'Year-round',o:'Clipped lollipops flanking the bifold doors give elegant year-round structure. Belfast\'s mild maritime winters mean bay trees rarely need winter protection in a sheltered patio.'},
{n:'Scented Rose',l:'Rosa "Princess Alexandra of Kent"',t:'Shrub rose in pot',s:'Jun–Oct',o:'Compact and heavily fragrant. Belfast\'s softer light suits roses beautifully — colours are richer and flowers last longer in cool conditions.'},
{n:'English Lavender',l:'Lavandula angustifolia "Hidcote"',t:'Shrub',s:'Jun–Aug',o:'In Belfast\'s wetter climate, English lavender is a better choice than French or Spanish varieties — more tolerant of moisture and cold. Ensure excellent drainage.'},
{n:'Agapanthus',l:'Agapanthus "Headbourne Hybrids"',t:'Perennial in pot',s:'Jul–Sep',o:'The hardiest agapanthus available. Mulch heavily in autumn and ensure excellent pot drainage. Keep close to the house wall for protection.'},
{n:'Scented Pelargonium',l:'Pelargonium "Attar of Roses"',t:'Tender perennial',s:'May–Oct',o:'Rose-scented leaves — extraordinary fragrance when brushed. Belfast\'s mild summers are actually ideal: pelargoniums produce their best fragrance in cool conditions. Overwinter on a warm windowsill.'}
]},
lawn:{a:'South-facing open lawn · best light in garden · Belfast maritime climate',i:'Your best-lit space — south-facing and open. Belfast\'s maritime climate brings reliable moisture, which suits many summer performers. The 1-storey garage to the east casts a morning shadow that clears mid-morning. The 5ft west hedge provides shelter from the prevailing SW winds.',p:[
{n:'Dahlia',l:'Dahlia "Café au Lait"',t:'Tuber in pot',s:'Jul–Oct',o:'The great summer showstopper — enormous blowsy flowers in champagne tones. Belfast\'s cool summers suit dahlias well: heat stress is rarely a problem and colours stay richer longer. Lift tubers in November.'},
{n:'Japanese Maple',l:'Acer palmatum "Dissectum Garnet"',t:'Tree in pot',s:'Spring–Autumn',o:'Weeping, finely-cut burgundy foliage turning brilliant scarlet in October. Position with some shelter from the west hedge. Belfast\'s mild winters rarely cause the frost damage seen in colder UK gardens.'},
{n:'Miscanthus',l:'Miscanthus sinensis "Morning Light"',t:'Ornamental grass',s:'Summer–winter',o:'Elegant grass that moves beautifully in Belfast\'s frequent breezes. Extraordinary seedheads persist through the mild winter providing structure when other plants have died back.'},
{n:'Honeysuckle',l:'Lonicera periclymenum "Serotina"',t:'Climber on fence',s:'Jun–Oct',o:'Train along the south fence. Belfast\'s cool, moist climate is ideal — the evening fragrance is extraordinary, and in cool conditions the flowers last far longer than in hot summers.'},
{n:'Hydrangea',l:'Hydrangea paniculata "Limelight"',t:'Shrub in pot',s:'Jul–Sep',o:'A spectacular panicle hydrangea — large conical flower heads start lime-green, turn white, then blush pink into autumn. Handles the open south-facing aspect well and is among the most reliable hydrangeas in Belfast\'s climate.'}
]}
};

var cur=null;
function sel(id){
  if(cur){
    var pe=document.getElementById('mz-'+cur);
    if(pe){var pr=pe.querySelector('rect,polygon');if(pr&&pr.dataset.os!==undefined){pr.setAttribute('stroke',pr.dataset.os);pr.setAttribute('stroke-width',pr.dataset.ow);}}
    document.querySelectorAll('.zpill').forEach(function(b){b.classList.remove('on');});
  }
  cur=id;
  var el=document.getElementById('mz-'+id);
  if(el){var r=el.querySelector('rect,polygon');if(r){if(r.dataset.os===undefined){r.dataset.os=r.getAttribute('stroke')||'none';r.dataset.ow=r.getAttribute('stroke-width')||'0.5';}r.setAttribute('stroke','#BA7517');r.setAttribute('stroke-width','2.5');}}
  document.querySelectorAll('.zpill[data-z="'+id+'"]').forEach(function(b){b.classList.add('on');});
  var z=zones.find(function(z){return z.id===id;});
  var d=D[id];
  document.getElementById('em').style.display='none';
  var zc=document.getElementById('zc');
  zc.style.display='block';
  zc.innerHTML='<div class="zone-header"><div class="zname">'+z.name+'</div><div class="zaspect">'+d.a+'</div><div class="zintro">'+d.i+'</div></div><div class="plants-label">Recommended plants</div><div class="plant-grid">'+d.p.map(function(p){return '<div class="pcard" data-latin="'+p.l.replace(/"/g,"&quot;")+'"><div class="pimg-wrap shimmer"><img class="pimg" alt="'+p.n+'"></div><div class="pcard-body"><div class="pname">'+p.n+'</div><div class="platin">'+p.l+'</div><span class="pbadge ptype">'+p.t+'</span><span class="pbadge pseas">'+p.s+'</span><div class="pnote">'+p.o+'</div></div></div>';}).join('')+'</div>';
  // Fetch plant images: wiki species → wiki genus → commons species → commons genus → placeholder
  // Override table: genus names that hit Wikipedia disambiguation pages or illustration-heavy articles
  var wikiAlt={'Rosa':'Rose','Narcissus':'Narcissus_(plant)','Helleborus':'Helleborus_orientalis'};
  function loadPlantImg(card){
    var latin=card.dataset.latin;
    var words=latin
      .replace(/["'\u2018\u2019\u201c\u201d].*$/,'')
      .replace(/\bor\b.*$/i,'')
      .replace(/\(.*?\)/g,'')
      .replace(/\bx\b/g,'')
      .replace(/[,·]/g,'')
      .trim().split(/\s+/)
      .filter(function(w){return w.length>1&&!/^(var|subsp|f|cv)\.?$/i.test(w);});
    var genus=words[0]||'';
    var species=words.slice(0,2).join('_');
    if(!genus)return;
    var wrap=card.querySelector('.pimg-wrap');
    var img=card.querySelector('.pimg');
    var queue=[];
    if(species&&species!==genus)queue.push('wiki\t'+species);
    if(wikiAlt[genus])queue.push('wiki\t'+wikiAlt[genus]);
    queue.push('wiki\t'+genus);
    if(species&&species!==genus)queue.push('commons\t'+words.slice(0,2).join(' '));
    queue.push('commons\t'+genus);
    function next(){
      if(!queue.length){placeholder();return;}
      var parts=queue.shift().split('\t');
      parts[0]==='wiki'?wikiImg(parts[1]):commonsImg(parts[1]);
    }
    function showImg(src){
      img.onload=function(){img.classList.add('loaded');wrap.classList.remove('shimmer');};
      img.onerror=function(){next();};
      img.src=src;
    }
    function wikiImg(name){
      fetch('https://en.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(name)+'&prop=pageimages&format=json&pithumbsize=400&redirects=1&origin=*')
        .then(function(r){return r.json();})
        .then(function(d){
          var p=d.query&&d.query.pages&&Object.values(d.query.pages)[0];
          if(p&&p.thumbnail&&p.thumbnail.source)showImg(p.thumbnail.source);else next();
        }).catch(next);
    }
    function commonsImg(name){
      fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch='+encodeURIComponent(name)+'&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*&gsrlimit=16')
        .then(function(r){return r.json();})
        .then(function(d){
          var pages=d.query&&d.query.pages;
          if(!pages){next();return;}
          var src=null;
          Object.values(pages).some(function(p){
            if(p.imageinfo&&p.imageinfo[0]){
              var u=p.imageinfo[0].thumburl||p.imageinfo[0].url;
              if(u&&/\.(jpg|jpeg|png)$/i.test(u)&&!/diagram|map|distribution|range|chart|icon|logo|illustration|drawing|litho|engraving|kunstform|k.hler|bot_|watercolor|aquarell/i.test(u)){src=u;return true;}
            }
          });
          if(src)showImg(src);else next();
        }).catch(next);
    }
    function placeholder(){wrap.classList.remove('shimmer');wrap.classList.add('ph');wrap.innerHTML='<span class="ph-icon">🌿</span>';}
    next();
  }
  zc.querySelectorAll('.pcard[data-latin]').forEach(loadPlantImg);
  // scroll info into view on mobile
  if(window.innerWidth<680){
    setTimeout(function(){document.querySelector('.right-col').scrollIntoView({behavior:'smooth',block:'start'});},100);
  }
}

// Build zone strip
var strip=document.getElementById('zstrip');
zones.forEach(function(z){
  var b=document.createElement('button');
  b.className='zpill';b.dataset.z=z.id;
  b.innerHTML='<span class="dot" style="background:'+z.color+'"></span>'+z.name;
  b.addEventListener('click',function(){sel(z.id);});
  strip.appendChild(b);
});

// Map zone click handlers
document.querySelectorAll('.map-zone').forEach(function(el){
  el.addEventListener('click',function(){sel(el.dataset.z);});
});
</script>
